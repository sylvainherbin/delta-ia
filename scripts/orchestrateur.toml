# Delta — configuration de l'orchestrateur des passages automatiques (D70), lue par scripts/orchestrateur.py.
# Aucun secret ici. Les modèles, efforts et délais sont des choix de Sylvain : les modifier ici, rien d'autre à toucher.

[chaine]
# Étapes actives de la chaîne, dans l'ordre de la section [etapes.*] ; la supervision tourne TOUJOURS en dernier, elle n'a pas
# à figurer ici. Déploiement terminé le 02/10/2026 : les cinq étapes sont actives.
# Vider la liste ne lance que la supervision.
etapes_actives = ["delta", "codex-delta", "delta-kb", "codex-delta-kb"]
verrou = ".git/delta-passage.lock"   # tenu par scripts/passage-auto.sh (flock) pendant toute la chaîne ; testé par la garde (code 14)
arret_delai_s = 10                   # après SIGTERM, attente avant SIGKILL sur tout le groupe de processus de l'étape
sortie_dossier = "rapports/auto"     # une sortie par étape et par jour ; rapports/ n'est jamais commité
# D122 : échec réseau d'une étape (voir orchestrateur.py) : trois relances au plus, après 5, 10 puis 20 min ; aucune tentative qui commence
# entre relances_limite et fenetre_fin (fin de la fenêtre de la chaîne) ; hôte dont la résolution DNS est attendue, par agent.
relances_reseau_s = [300, 600, 1200]
relances_limite = "07:30"
fenetre_fin = "08:00"
reseau_hotes = { claude = "api.anthropic.com", codex = "chatgpt.com" }
# Capteur de la liste X (décisions de Sylvain du 22/10/2026) : relevé par l'API X (jeton : trousseau, service x compte delta) avant la
# première étape, publication dédiée delta(x) des seuls IDs (push puis fast-forward), purge du texte après la supervision.
# Échec de relevé/publication non bloquant ; supprimer cette ligne désactive le capteur.
capteur_x = { delai_s = 180 }
path = ["~/.local/bin", "~/.nvm/current/bin", "/usr/local/sbin", "/usr/local/bin", "/usr/sbin", "/usr/bin", "/sbin", "/bin"]

[claude]
mode = "cle"                       # réversible : "abonnement" restaure les commandes précédentes
bin = "~/.local/bin/claude"
bin_cle = "~/.local/bin/claude-cle"
# Sur clé : --bare imposé par le lanceur, CLAUDE.md et REGLES.md fournis explicitement ; skills lues par leur chemin.
# --setting-sources project conservé ; listes allow/deny fournies aussi en --allowedTools/--disallowedTools
# (project ignore allow dans une copie non approuvée). Supervision : mêmes listes CLI, aucune source project,
# sans --settings (réservé à apiKeyHelper). Code 5 : repli unique sur abonnement après nouvelle garde complète,
# journal <étape>-repli-abonnement, code 5 ; les quotas abonnement redeviennent applicables.
# Chaque étape Claude : -p ... --permission-mode bypassPermissions (D83, décision de Sylvain du 06/10/2026) --strict-mcp-config --output-format json,
# stdin fermé. Les étapes /delta et /delta-kb ne chargent que les réglages du projet (.claude/settings.json, dont la liste
# `allow`) ; la supervision n'en charge aucun et reçoit sa propre liste (.claude/supervision.settings.json).
sources_etapes = "project"

[codex]
# CLI npm du K8, via le lien stable nvm (aucune version de Node figée). Son interpréteur node est trouvé dans
# chaine.path, même sous systemd. La version est lue sur ce binaire et inscrite dans le journal de chaque étape Codex.
# Binaire absent : échec explicite de l'étape, code 127 (binaire introuvable).
bin = "~/.nvm/current/bin/codex"
# Configuration explicite passée par -c avec --ignore-user-config : le réglage global de ~/.codex/config.toml
# (danger-full-access, approval_policy never) n'est jamais chargé. Profil de permissions « delta_auto » : lecture du système,
# écriture dans le dépôt et dans son .git (nécessaire à git commit), réseau (fetch.py, git pull, git push), jamais d'approbation.
# Interdits dans ce fichier : --approve-for-me, --dangerously-bypass-approvals-and-sandbox, --dangerously-bypass-hook-trust.
config = [
  'default_permissions="delta_auto"',
  'approval_policy="never"',
  'permissions.delta_auto.extends=":workspace"',
  'permissions.delta_auto.network.enabled=true',
  'permissions.delta_auto.filesystem={":workspace_roots"={".git"="write"}}',
  'model="gpt-6.1-sol"',
  'model_reasoning_effort="high"',
]

# --- étapes, dans l'ordre ; chacune ne démarre qu'à la fin de la précédente ---------------------------------------

[etapes.delta]
agent = "claude"
usage = "delta-passage"
garde = "delta"
modele = "sonnet"
effort = "high"
delai_min = 45
prompt = "Lis .claude/skills/delta/SKILL.md et exécute le passage en mode automatique (D68), sans poser de question."
# Sujets de commit que l'étape doit produire : un refus de permission n'est un simple avertissement que si l'étape les a tous
# produits et poussés (sinon code 125, fatal). Un début de sujet suffit (`delta(claude): 2026-10-02 — 9 éléments (3 fort)`).
commits_attendus = ["delta(claude):", "delta(actu):"]
# Après l'étape, l'orchestrateur relance `valider.py --perimetre <p> --date <jour>` pour chacun (code 131 si l'un échoue ; étapes kb : `--kb` du produit `kb`).
valider = ["claude", "actu"]
# Arrêt propre (D68) : seuls ces chemins sont remis en place, jamais autre chose.
checkout = ["docs/data/versions.json", "docs/data/etat.json", "docs/data/claude", "docs/data/actu", "docs/data/kb/claude",
            "docs/data/kb/recent.json", "docs/data/kb/a-tester.json", "docs/data/kb/noms.json", "docs/data/semaine", "docs/data/recherche.json", "state/claude.json", "state/actu.json"]
clean = ["docs/data/claude", "docs/data/actu", "docs/data/kb/recent.json", "docs/data/kb/a-tester.json", "docs/data/kb/noms.json", "docs/data/semaine", "docs/data/recherche.json"]

[etapes.codex-delta]
agent = "codex"
garde = "codex-delta"
delai_min = 45
prompt = "Lis .agents/skills/delta/SKILL.md et exécute le passage en mode automatique (D70), sans poser de question."
commits_attendus = ["delta(openai):"]
valider = ["openai"]
checkout = ["docs/data/openai", "docs/data/kb/openai", "docs/data/kb/recent.json", "docs/data/kb/a-tester.json", "docs/data/kb/noms.json", "state/openai.json"]
clean = ["docs/data/openai", "docs/data/kb/recent.json", "docs/data/kb/a-tester.json", "docs/data/kb/noms.json"]

[etapes.delta-kb]
agent = "claude"
usage = "delta-kb-passage"
garde = "delta-kb"
kb = "claude"                        # étape sautée (ligne à 0, code 129) quand aucun lot n'est dû
valider_kb = true                    # après l'étape : `valider.py --perimetre claude --kb` (code 131 s'il échoue)
modele = "opus"                      # la skill /delta-kb fixe Opus 5.5 (épargne la limite Fable)
effort = "high"
delai_min = 45
prompt = "Lis .claude/skills/delta-kb/SKILL.md et exécute le lancement en mode automatique (D70), sans poser de question."
commits_attendus = ["delta-kb(claude):"]
checkout = ["docs/data/kb/claude", "docs/data/kb/recent.json", "docs/data/kb/a-tester.json", "docs/data/kb/noms.json"]
clean = ["docs/data/kb/claude", "docs/data/kb/recent.json", "docs/data/kb/a-tester.json", "docs/data/kb/noms.json"]

[etapes.codex-delta-kb]
agent = "codex"
garde = "codex-delta-kb"
kb = "openai"
valider_kb = true                    # après l'étape : `valider.py --perimetre openai --kb` (code 131 s'il échoue)
delai_min = 45
prompt = "Lis .agents/skills/delta-kb/SKILL.md et exécute le lancement en mode automatique (D70), sans poser de question."
commits_attendus = ["delta-kb(openai):"]
checkout = ["docs/data/kb/openai", "docs/data/kb/recent.json", "docs/data/kb/a-tester.json", "docs/data/kb/noms.json"]
clean = ["docs/data/kb/openai", "docs/data/kb/recent.json", "docs/data/kb/a-tester.json", "docs/data/kb/noms.json"]

# Supervision : toujours lancée en dernier, même si une étape a échoué ; lecture seule stricte.
[etapes.supervision]
agent = "claude"
usage = "delta-supervision"
supervision = true
modele = "sonnet"
effort = "medium"
delai_min = 15
prompt_fichier = "prompts/supervision.md"
settings = ".claude/supervision.settings.json"
