  efforts:
  - effort: low
    defaut: false
    usage: claude --model claude-opus-5-5 --effort low
    cout_quota:
      niveau: inconnu
      poids_relatif: null
      resume: Coût par effort non publié ; dépend de la tâche, du contexte, des outils et du compte.
    effet_effort: Niveau le plus économe ; privilégie la vitesse avec une réduction possible de capacité.
    recommandation_operer:
      verdict: ignorer
      natures_adaptees:
      - question ponctuelle exigeant la plume d'Opus sans longue exploration
      natures_deconseillees:
      - mecanique
      - exploration
      - code multi-fichiers
      pourquoi: 'Conseil local : tâches brèves et bornées ; vérifier la complétude.'
  - effort: medium
    defaut: true
    usage: claude --model claude-opus-5-5 --effort medium
    cout_quota:
      niveau: inconnu
      poids_relatif: null
      resume: Coût par effort non publié ; dépend de la tâche, du contexte, des outils et du compte.
    effet_effort: Compromis entre capacité, vitesse et consommation de jetons.
    recommandation_operer:
      verdict: utiliser
      natures_adaptees:
      - session interactive de rôle (chef, pilote)
      - cadrage
      - conception
      - diagnostic
      natures_deconseillees:
      - mecanique
      - extraction factuelle
      - inventaire
      pourquoi: 'Conseil local : travail courant avec contrôles explicites.'
  - effort: high
    defaut: false
    usage: claude --model claude-opus-5-5 --effort high
    cout_quota:
      niveau: inconnu
      poids_relatif: null
      resume: Coût par effort non publié ; dépend de la tâche, du contexte, des outils et du compte.
    effet_effort: Consacre les jetons nécessaires aux tâches complexes ; la consommation dépend de la tâche.
    recommandation_operer:
      verdict: utiliser
      natures_adaptees:
      - architecture complexe
      - audit transversal
      - design
      - droits et secrets
      natures_deconseillees:
      - mecanique
      - correctif simple
      - relecture bornée
      pourquoi: 'Conseil local : tâches complexes ou longues avec vérifications.'
  - effort: xhigh
    defaut: false
    usage: claude --model claude-opus-5-5 --effort xhigh
    cout_quota:
      niveau: inconnu
      poids_relatif: null
      resume: Coût par effort non publié ; dépend de la tâche, du contexte, des outils et du compte.
    effet_effort: Capacité étendue pour les tâches agentiques et de code à long horizon ; comparer sur ses
      propres évaluations.
    recommandation_operer:
      verdict: tester
      natures_adaptees:
      - recherche ou débogage profond ayant échoué à high
      natures_deconseillees:
      - missions courantes
      - toute mission sous tension de quota (< 30 % restants)
      pourquoi: 'Conseil local : augmenter seulement si les évaluations montrent un gain.'
  - effort: max
    defaut: false
    usage: claude --model claude-opus-5-5 --effort max
    cout_quota:
      niveau: inconnu
      poids_relatif: null
      resume: Coût par effort non publié ; dépend de la tâche, du contexte, des outils et du compte.
    effet_effort: Capacité maximale sans contrainte de dépense de jetons liée au niveau ; à réserver aux gains
      mesurés.
    recommandation_operer:
      verdict: ignorer
      natures_adaptees: []
      natures_deconseillees:
      - toutes missions OPÉRER standard
      pourquoi: 'Conseil local : réserver aux tâches dont la qualité justifie le surcroît de temps.'
