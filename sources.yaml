  - id: oa-cli
    perimetre: openai
    produit: codex
    extracteur: codex_cli
    url: https://learn.chatgpt.com/docs/developer-commands?surface=cli
    statut: ok
    note: >-
      Testé le 2026-09-23 : la variante Markdown (`developer-commands.md?surface=cli`, 49 Ko) ne contient
      que des références `<ConfigTable options={…}>` ; les tableaux ne sont rendus que dans la page HTML
      (200, 1 Mo, 32 tableaux : options globales, vue d'ensemble des commandes, options par sous-commande,
      commandes `codex mcp` et `codex plugin`, commandes `/`, commandes de l'extension IDE). Les deux sont lues :
      l'ordre des `ConfigTable` du Markdown nomme les tableaux HTML (sandboxMacOptions, mcpCommands…), et
      un écart de nombre lève FormatInattendu. Tableaux macOS et Windows exclus (D42).
    options:
      url_md: https://learn.chatgpt.com/docs/developer-commands.md?surface=cli

  - id: oa-config
    perimetre: openai
    produit: codex
    extracteur: configtable
    url: https://learn.chatgpt.com/docs/config-file/config-reference.md
    statut: ok
    note: >-
      Testé le 2026-09-23 : 200, 110 Ko ; la référence de `config.toml` est un composant
      `<ConfigTable options={[{key, type, description}, …]}>` écrit en JavaScript dans le Markdown
      (297 objets). Section `requirements.toml` (règles imposées par l'administrateur) exclue (D42).
