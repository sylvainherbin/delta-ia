    note: >-
      Testé le 2026-09-23 : 200, text/markdown, 178 Ko, tableau « All commands » de 114 commandes `/`.
      Les skills intégrées y sont marquées **Skill** (catégorie skills), les workflows **Workflow**.
    options:
      section: "All commands"
      categorie: commandes
      categorie_si_marque: {"Skill": skills}
      exclure: "bedrock|vertex|foundry|install-slack-app|setup-"

