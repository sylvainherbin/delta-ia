  - id: claude-aide-index
    perimetre: claude
    produit: claude
    type: html
    url: https://support.claude.com/llms.txt
    statut: a_valider
    officielle: true
    note: >-
      Testé le 2026-09-30 : 200, text/plain, 698 Ko (index des articles dans dix langues), 359 articles dans la
      section `## English`. Étape 2a (D71) : seuls les articles dont le titre touche au compte et aux quotas (mots-clés
      de `deltalib/sujet_d71.py`) deviennent des éléments ; 58 sur 359 le 2026-09-30. Identifiant = numéro d'article
      (un titre ou un slug modifié ne crée pas un nouvel article). Un article absent de l'état est un « nouvel article
      d'aide » : il est lu en Markdown (`lire_articles: markdown`). Première lecture : l'existant est inscrit comme
      référence (`amorcage_silencieux`) et résumé en une ligne dans l'élément « État initial… » (`etat_initial`). C'est ce qui aurait attrapé la remise à zéro
      du 23/09 (article 17007452). Gabarit non contractuel : section `## English` ou lignes `- [titre](url)` introuvables
      remontent en `sources_en_echec`.
    options:
      etat_initial: "État initial des pages compte et quotas suivies"
      format: index_articles
      section: English
      nom: Nouvel article d'aide
      lire_articles: markdown
      amorcage_silencieux: true

  - id: claude-blog
    perimetre: claude
    produit: claude
    type: html
    url: https://claude.com/blog
    statut: a_valider
    officielle: true
    note: >-
      Testé le 2026-10-01 : 200, text/html, 805 Ko, identique octet pour octet sur deux lectures successives. Aucun flux
      (blog/rss.xml, blog/rss, blog/feed, rss.xml : 404 ; aucun <link rel="alternate"> de flux), aucune balise <time> :
      page Webflow dont la liste `.blog_cms_list` porte, par article, titre, date en toutes lettres, catégorie et lien dans
      des attributs Finsweet `fs-list-field` (15 articles par page, 17 pages ; seule la première est lue, du 15 au
      30/09/2026 ; la pagination utilise un hachage Webflow `?d7430fcd_page=2`, non contractuel). Retrouve les billets
      « Claude Marketplace » (23/09) et « Claude Tag now supports personal connectors in channels » (24/09) : aucun élément
      publié dans docs/data/claude/ ni docs/data/actu/ (23/09 au 01/10) ne les cite, et aucune URL claude.com/blog n'y figure
      (recherche du 2026-10-01 ; la newsroom et les notes de version de l'époque n'ont pas été relues). Option `lire_articles: true` (A1) : le texte de chaque nouvel article se lit avec `texte_article`
      (testé sur ces deux billets : 5 172 et 4 644 caractères). Un changement de gabarit remonte en `sources_en_echec`.
      Doublon probable avec la newsroom pour les annonces de modèles : la déduplication reste à l'agent.
    options:
      format: html_blog_liste
      lire_articles: true

  - id: anthropic-status
    perimetre: claude
    produit: claude
    type: json
    url: https://status.claude.com/api/v2/incidents.json
    statut: a_valider
    officielle: true
    note: >-
      Testé le 2026-10-01 depuis la machine de Sylvain : 200, application/json, 194 Ko, 50 incidents du 22/07 au
      29/09/2026 (schéma Statuspage : id, name, status, impact, created_at, resolved_at, incident_updates, components) ;
      la panne Claude du 29/09 (« Elevated errors on claude.ai, Claude Code, Claude Cowork and the Claude API ») y figure et
      est lue par l'analyseur `statuspage` (échantillon réel dans tests/fixtures/status_claude_incidents.json).
      status.anthropic.com redirige en 301 vers https://status.claude.com/ (le domaine a changé). Repli :
      https://status.claude.com/history.rss (200, 39 Ko). La session cloud de l'étape 2b avait classé cette source `bloque`
      sur un échec d'egress de son conteneur (CONNECT 403), pas sur un refus du site. Un incident ne remonte qu'une fois,
      à son ouverture (`suivre_revisions: false`) ; les incidents d'impact `none` sont ignorés (`ignorer_impacts`, 4 sur
      50) ; un incident ouvert à `none` puis aggravé arrive au passage où son impact change. Produit déduit du nom :
      `claude-code` si « claude code » y figure, sinon `claude`.
    options:
      format: statuspage
      url_publique: https://status.claude.com
      suivre_revisions: false
      ignorer_impacts: [none]
      produits_par_mot:
        claude-code: ["claude code"]

  # ---------------------------------------------------------------- openai
  - id: codex-cli-releases
    perimetre: openai
    produit: codex
    type: github_releases
    url: https://api.github.com/repos/openai/codex/releases?per_page=10
    statut: ok
    officielle: true
    note: >-
      Testé le 2026-09-23 : 200, tags `rust-v0.156.1`, champ `prerelease` fiable, corps Markdown structuré.
      Cadence observée le 2026-09-23 : 11 alphas en deux jours. Les pré-versions sont exclues par défaut.
      Chaque release pèse ~300 Ko dans l'API (liste des binaires) : mesuré le 2026-09-23, 20 releases = 6 Mo
      en 135 s, 10 = 3 Mo en 17 s, 12 = 3,7 Mo en 6 s (très variable). Pagination adaptative (D4) : page
      suivante tant que la plus ancienne release vue est postérieure à la borne, 4 pages au plus, puis
      `partiel` (trou possible). `options.url_latest` (releases/latest) garantit la dernière version stable.
    options:
      prefixe_tag: rust-v
      inclure_prereleases: false
      nom: Codex CLI
      url_latest: https://api.github.com/repos/openai/codex/releases/latest

  - id: openai-changelog-general
