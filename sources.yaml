# ============================================================================================================
# Documentation de référence (phase 4, D40, D42, D44). Pages lues par `fetch.py --kb <produit>…` (copie et
# empreinte dans raw/kb/), puis extraites sans modèle par `scripts/catalogue.py` vers docs/data/kb/<p>/.
# Champs : id, perimetre, produit, extracteur, url (ou base + pages), statut, note, options.
# Exclusions D42 : entreprise et administration, fournisseurs cloud (Bedrock, Vertex, Foundry), Windows et
# macOS (Linux, iOS et le web sont gardés), API de la plateforme Claude.
# ============================================================================================================

documentation:

