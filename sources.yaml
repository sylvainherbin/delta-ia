      non documenté que `openai-changelog-general` : peut changer sans préavis.

  - id: openai-tarifs
    perimetre: openai
    produit: codex
    type: html
    url: https://learn.chatgpt.com/docs/pricing.md
    statut: a_valider
    officielle: true
    note: >-
      Testé le 2026-09-26 : 200, text/markdown, 46,5 Ko, redirection depuis developers.openai.com/codex/pricing.
      Page de tarifs commune à ChatGPT Work et Codex : plans et crédits, parrainage (promotions datées, ex.
      « From June 11 through June 24, 2026 … banked rate-limit reset »), limites d'usage. Suivie par
      empreinte de section (O2) : chaque section suivie est un élément non daté qui revient en révision
      quand son texte change ; au premier passage, l'état actuel des cinq sections arrive une fois.
      Variante .md annoncée par la page elle-même, mais structure non contractuelle : peut changer sans préavis
      (une section suivie introuvable remonte en sources_en_echec).
      Observation (étape 2a, 2026-09-30) : 4 passages réels avec la source (27, 28, 29 et 30/09 ; le passage du 26/09
      à 00:21 précède son inscription de 10:51), aucune source en échec ; éléments : 5 sections au premier passage
      (27/09), puis 2 révisions le 30/09 (plans-credits, parrainage : nouveaux forfaits Pro et règles de parrainage, des
      changements réels et non du bruit). Critère de la SPEC (7 passages sans échec ni bruit anormal) non rempli :
      il manque 3 passages, soit le 2026-10-03 à raison d'un passage par jour. Reste `a_valider`.
    options:
