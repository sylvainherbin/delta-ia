  - id: openai-status
    perimetre: openai
    produit: chatgpt
    type: json
    url: https://status.openai.com/api/v2/incidents.json
    statut: a_valider
    officielle: true
    note: >-
      Testé le 2026-10-01 : 200, application/json, 38,6 Ko, 25 incidents du 13/09 au 30/09/2026 (schéma Statuspage :
      id, name, status, impact, created_at, resolved_at, incident_updates ; pas de `components`). Hypothèse « la page d'état
      expose un flux machine » confirmée pour OpenAI (incident.io). Repli : https://status.openai.com/history.rss (200,
      application/rss+xml, 95 Ko, 96 incidents depuis le 07/07/2026, composants affectés dans la description ; `feed.rss`
      est la même page ; `pubDate` = dernière mise à jour, pas l'ouverture ; liens avec double barre `//incidents/`, qui
      redirige en 308 vers le lien propre). Date de l'élément = ouverture de l'incident (UTC). Impact lu : `none`, `minor`,
      `major`, `critical`. Produit déduit du nom de l'incident : `codex` si « codex » y figure, sinon `chatgpt` (une
      panne d'API sans mention reste en `chatgpt`). Retrouve « Issues with Codex » (25/09, impact `critical`). Bruit
      maîtrisé : 2 à 5 incidents par jour ; un incident ne remonte qu'une fois, à son ouverture (`suivre_revisions: false`), et
      les incidents d'impact `none` sont ignorés (`ignorer_impacts`, 7 sur 25 le 2026-10-01) ; un incident ouvert à `none`
      puis aggravé arrive au passage où son impact change.
    options:
      format: statuspage
      url_publique: https://status.openai.com
      suivre_revisions: false
      ignorer_impacts: [none]
      produits_par_mot:
        codex: [codex]

