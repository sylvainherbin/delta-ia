  - id: openai-deprecations
    perimetre: openai
    produit: codex
    type: html
    url: https://developers.openai.com/api/docs/deprecations.md
    statut: a_valider
    officielle: true
    note: >-
      Testé le 2026-10-01 depuis le conteneur de dev : 200, text/markdown, 37 993 octets, empreinte identique sur
      deux lectures successives. Variante HTML : https://developers.openai.com/api/docs/deprecations (200, 483 Ko).
      platform.openai.com/docs/deprecations redirige ici (301 ; variante `.md` incluse). Page officielle des
      dépréciations de l'API (étape 2c) : section « Model deprecation notice periods » (préavis : 6 mois pour un modèle
      disponible en général, 3 mois pour une variante, 2 semaines pour un aperçu) et une annonce par titre
      `### AAAA-MM-JJ: titre`, sous « Upcoming deprecations » (annonces en attente, y compris sans date : « Update to
      OpenAI’s self-serve fine-tuning ») et « Past deprecations » (annonces datées seulement) : 36 éléments au premier
      passage, la plus récente 2026-09-11 (gpt-5.4-cyber, retrait le 2026-10-01). Suivie par empreinte (O2) : un tableau
      modifié ou une date de retrait changée fait revenir l'annonce en révision. Identifiant `<source>-<date>-<titre
      slugifié>`, `<source>-<titre slugifié>` pour une annonce sans date : un titre réécrit crée un nouvel élément.
      Amorçage D30 sur J-7 : les annonces datées plus anciennes (dont les retraits encore à venir) vont dans `ignores` ;
      option `amorcage_jours: 180` (D30 prend sinon J-7) : au premier passage, les annonces des 180 derniers jours
      arrivent, regroupées en UN élément « état initial » (option `etat_initial`, une ligne par annonce) au lieu d'un par
      annonce ; les plus anciennes vont dans `ignores`. 180 jours = le préavis maximal de la page (6 mois pour un modèle
      disponible en général) : une annonce encore ouverte ne peut guère être plus ancienne, et le premier passage réel
      a lieu à partir du 02/10/2026, quand 120 jours auraient déjà écarté les annonces du 03/06 (prompts réutilisables,
      évaluations, Agent Builder, retrait le 30/11). Retraits à venir couverts : GPT-5.4-Cyber le 01/10, transcription,
      audio, GPT-5 et o3, images GPT, et ces trois-là ; quelques retraits déjà passés (05/05, deux du 22/04) y figurent
      aussi. Le préavis, non daté, arrive avec elles. Format analysé par `annonces_datees`. Gabarit non contractuel : un parent ou une section
      introuvable remonte en `sources_en_echec`. À observer 7 passages réels avant `ok`. Étape 2d : option `echeances` ; les
      retraits des tableaux (« Shutdown date »), et les étapes datées des tableaux « Date / Update » (fonctionnalités :
      Evals, Agent Builder, prompts réutilisables, fine-tuning), donnent des éléments
      `echeance-openai-deprecations-<modèle>-<date>-j14` et `-j1` (`deltalib/echeances.py`). Ancres vérifiées le 2026-10-01
      sur la page HTML : `5.4` donne `54` (réglage par défaut).
    options:
      format: annonces_datees
      nom: Dépréciations des modèles OpenAI
      echeances: true
      suivre_revisions: true
      amorcage_jours: 180
      etat_initial: "État initial des dépréciations OpenAI en cours"
      sections:
        - {id: preavis, titre: "^Model deprecation notice periods$"}
      parents:
        - {titre: "^Upcoming deprecations$", sans_date: true}
        - {titre: "^Past deprecations$"}

  - id: openai-usage-commande
    perimetre: openai
    produit: codex
    type: html
    url: https://learn.chatgpt.com/docs/developer-commands.md?surface=cli
    statut: a_valider
    officielle: true
    note: >-
      Testé le 2026-09-30 : 200, text/markdown, 49 129 octets. Section « View account usage with `/usage` » : documente
      la remise à zéro gagnée de Codex (« redeem an available earned reset ») et les vues `/usage daily|weekly|cumulative`.
      Suivie par empreinte (O2, étape 2a, D71) ; au premier passage, figure dans l'élément unique « État initial… » (`etat_initial`). help.openai.com
      (llms.txt et articles) répond 403 (défi Cloudflare) comme `chatgpt-release-notes` : non contourné. La page
      `codex-manual.md` (2,8 Mo) ne contient aucun réglage de remise à zéro : non suivie. Structure de la page non
      contractuelle : peut changer sans préavis (section introuvable : `sources_en_echec`).
    options:
      etat_initial: "État initial des pages compte et quotas suivies"
      format: sections_suivies
      nom: Codex /usage
      suivre_revisions: true
      sections:
        - {id: usage, titre: "^View account usage with"}

