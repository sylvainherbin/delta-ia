    note: >-
      Testé le 2026-09-23 : la variante Markdown (`developer-commands.md?surface=cli`, 49 Ko) ne contient
      que des références `<ConfigTable options={…}>` ; les tableaux ne sont rendus que dans la page HTML
      (200, 1 Mo, 32 tableaux : options globales, vue d'ensemble des commandes, options par sous-commande,
      commandes `codex mcp` et `codex plugin`, commandes `/`, commandes de l'extension IDE). Les deux sont lues :
      l'ordre des `ConfigTable` du Markdown nomme les tableaux HTML (sandboxMacOptions, mcpCommands…), et
      un écart de nombre lève FormatInattendu. Tableaux macOS et Windows exclus (D42).
