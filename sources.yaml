      et partage Space (mot « limits »), Codex for Open Source, sign-in. Étape 2a (D71) : une page de ce sujet absente de l'état est un « nouvel article d'aide », lu en
      Markdown (`lire_articles: markdown`) ; première lecture inscrite comme référence (`amorcage_silencieux`) et résumée dans l'élément « État initial… ». Identifiant = chemin
      de la page. Les pages Enterprise (limites, coût et usage, insights) ne sont pas suivies par section : CONTEXTE.md
      donne ChatGPT Pro à Sylvain, pas un espace Enterprise ; leur apparition reste détectée par cet index. Format de
      l'index non contractuel : peut changer sans préavis (gabarit changé : `sources_en_echec`).
    options:
      etat_initial: "État initial des pages compte et quotas suivies"
      format: index_articles
