  - id: anthropic-deprecations
    perimetre: claude
    produit: claude
    type: html
    url: https://platform.claude.com/docs/en/about-claude/model-deprecations.md
    statut: a_valider
    officielle: true
    note: >-
      Testé le 2026-10-01 depuis le conteneur de dev : 200, text/markdown, 14 127 octets, empreinte identique sur
      deux lectures successives. Variante HTML : même URL sans `.md` (200, 433 Ko). docs.anthropic.com/en/docs/about-claude/model-deprecations
      redirige ici (301 puis 307, 200 ; variante `.md` incluse). Page officielle des dépréciations de l'API
      (étape 2c) : section « Model status » (tableau modèle, état, date de dépréciation, retrait au plus tôt), section
      « Notifications » (préavis d'au moins 60 jours) et une annonce par titre `### AAAA-MM-JJ: titre` sous « Deprecation
      history » (12 éléments au premier passage dont 10 annonces ; la plus récente : 2026-09-30, Sonnet 4.5, retrait
      le 30/11/2026). Suivie par empreinte (O2) : une note « retired » ajoutée à une annonce, une ligne du tableau ou
      un nouveau modèle fait revenir l'élément en révision (`revision: true`). Identifiant d'annonce `<source>-<date>-<titre
      slugifié>` : un titre réécrit crée un nouvel élément. Amorçage D30 sur J-7 : les annonces plus anciennes vont dans
      `ignores` ; le tableau d'état, non daté, arrive une fois en entier. Format analysé par `annonces_datees`
      (nouveau, `analyseurs/html_notes.py`). Gabarit non contractuel : un parent ou une section introuvable remonte en
      `sources_en_echec`. À observer 7 passages réels avant `ok`. Étape 2d : option `echeances` ; les retraits des tableaux
      des annonces (colonne « Retirement date ») donnent des éléments `echeance-anthropic-deprecations-<modèle>-<date>-j14`
      et `-j1` (`deltalib/echeances.py`). Le tableau d'état des modèles n'en produit pas (« Not sooner than » est une borne,
      pas un retrait annoncé). Ancres des titres vérifiées le 2026-10-01 sur la page HTML : `4.5` donne `4-5`
      (`ancre_points: tiret`).
    options:
      format: annonces_datees
      nom: Dépréciations des modèles Claude
      echeances: true
      ancre_points: tiret
      suivre_revisions: true
      sections:
        - {id: statut-modeles, titre: "^Model status$"}
        - {id: preavis, titre: "^Notifications$"}
      parents:
        - {titre: "^Deprecation history$"}

  - id: anthropic-newsroom
    perimetre: claude
    produit: claude
    type: html
    url: https://www.anthropic.com/news
    statut: a_valider
    officielle: true
    note: >-
      Testé le 2026-09-23 : 200, 463 Ko, chaque article est un lien contenant une balise <time>
      (`Sep 22, 2026`). Anthropic ne publie aucun flux RSS (rss.xml, news/rss, feed.xml : 404). Page
      Next.js : un changement de gabarit doit remonter en `sources_en_echec` (format inattendu).
      A1 (26/09) : chaque nouvel article est lu (un GET, environ 600 Ko de HTML) et son texte principal
      (plus long <article>, 20 000 caractères au plus) remplace le résumé dans `contenu` ; testé le
      2026-09-26 sur https://www.anthropic.com/claude-opus-5-5 (200, 620 Ko, 33 906 caractères de texte).
      Sans cette lecture, la remise à zéro des limites d'Opus 5.5 avait échappé au passage du 23/09.
    options:
      format: html_time_liens
      lire_articles: true

